<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. - Interface Web</title>
    <style>
        :root {
            --primary-color: #00f0ff;
            --bg-color: #050b14;
            --panel-bg: rgba(0, 240, 255, 0.05);
            --border-color: rgba(0, 240, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            letter-spacing: 4px;
            text-shadow: 0 0 10px var(--primary-color);
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .config-box {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input, button {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
        }

        input {
            flex: 1;
        }

        button {
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background: var(--primary-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--primary-color);
        }

        #chat-log {
            height: 400px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            padding: 15px;
            background: rgba(0, 10, 20, 0.8);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px;
            border-radius: 4px;
            max-width: 80%;
            word-break: break-word;
        }

        .user-msg {
            align-self: flex-end;
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

        .jarvis-msg {
            align-self: flex-start;
            border: 1px solid var(--primary-color);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 5px rgba(0, 240, 255, 0.2);
        }

        .input-area {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>J.A.R.V.I.S. SYSTEMS</h1>
        <p>Interface Neuronale Active - Propulsée par Gemini</p>
    </header>

    <div class="container">
        <!-- Configuration de la clé API -->
        <div class="config-box">
            <input type="password" id="api-key" placeholder="Entrez votre clé API Gemini ici...">
            <button onclick="sauvegarderCle()">Enregistrer</button>
        </div>

        <!-- Zone d'affichage des messages -->
        <div id="chat-log">
            <div class="message jarvis-msg">Jarvis : Systèmes en ligne. Bonjour monsieur. Veuillez configurer votre clé API pour commencer.</div>
        </div>

        <!-- Zone de saisie -->
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Donnez un ordre à Jarvis..." onkeypress="verifierEntree(event)">
            <button onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        window.onload = () => {
            const savedKey = localStorage.getItem("gemini_api_key");
            if (savedKey) {
                document.getElementById("api-key").value = savedKey;
                ajouterMessage("Jarvis : Clé API détectée en mémoire, monsieur.", "jarvis-msg");
            }
        };

        function sauvegarderCle() {
            const key = document.getElementById("api-key").value.trim();
            if (key) {
                localStorage.setItem("gemini_api_key", key);
                alert("Clé API enregistrée avec succès dans votre navigateur !");
            } else {
                alert("Veuillez entrer une clé valide.");
            }
        }

        function verifierEntree(e) {
            if (e.key === "Enter") {
                envoyerMessage();
            }
        }

        function ajouterMessage(texte, classe) {
            const chatLog = document.getElementById("chat-log");
            const div = document.createElement("div");
            div.className = `message ${classe}`;
            div.innerText = texte;
            chatLog.appendChild(div);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function faireParler(texte) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(texte);
                utterance.lang = 'fr-FR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function envoyerMessage() {
            const inputField = document.getElementById("user-input");
            const texteUtilisateur = inputField.value.trim();
            const apiKey = localStorage.getItem("gemini_api_key") || document.getElementById("api-key").value.trim();

            if (!texteUtilisateur) return;
            if (!apiKey) {
                alert("Veuillez d'abord configurer et enregistrer votre clé API Gemini.");
                return;
            }

            ajouterMessage(`Vous : ${texteUtilisateur}`, "user-msg");
            inputField.value = "";

            ajouterMessage("Jarvis : Analyse en cours...", "jarvis-msg");

            try {
                // Utilisation du modèle gemini-2.5-flash correct
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: "Tu es Jarvis, un assistant virtuel intelligent, sophistiqué, courtois et fidèle, inspiré de l'univers d'Iron Man. Réponds de manière concise, élégante et efficace en français à la demande suivante : " + texteUtilisateur
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                // Supprimer le message d'attente
                const chatLog = document.getElementById("chat-log");
                chatLog.removeChild(chatLog.lastChild);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reponseJarvis = data.candidates[0].content.parts[0].text;
                    ajouterMessage(`Jarvis : ${reponseJarvis}`, "jarvis-msg");
                    faireParler(reponseJarvis);
                } else {
                    console.error("Erreur API:", data);
                    const erreurMsg = data.error ? data.error.message : "Erreur inconnue";
                    ajouterMessage(`Jarvis : Erreur API -> ${erreurMsg}`, "jarvis-msg");
                }

            } catch (error) {
                console.error(error);
                const chatLog = document.getElementById("chat-log");
                chatLog.removeChild(chatLog.lastChild);
                ajouterMessage(`Jarvis : Erreur réseau -> ${error.message}`, "jarvis-msg");
            }
        }
    </script>
</body>
</html>
